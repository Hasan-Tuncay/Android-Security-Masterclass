name: Android CI & Security Verification

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify_secure_build:
    name: Verify Secure App & Common Modules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # ─── Scope Isolation Principle ──────────────────────────────────────────
      # Automated audits and verification are scoped strictly to :app-secure and :common.
      # :app-vulnerable and :app-attacker contain intentionally vulnerable code
      # by pedagogical design and are exempt from static failure gates.
      # ────────────────────────────────────────────────────────────────────────

      - name: Run Unit Tests on :common & :app-secure
        run: ./gradlew :common:testDebugUnitTest :app-secure:testDebugUnitTest --no-daemon

      - name: Assemble :common & :app-secure APK
        run: ./gradlew :common:assembleDebug :app-secure:assembleDebug --no-daemon
